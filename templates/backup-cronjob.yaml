#==============================================================================
# WORDPRESS ENCRYPTED BACKUP CRONJOB
#==============================================================================

{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wordpress-backup
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wordpress
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: database-dump
              image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}@{{ .Values.mariadb.image.digest }}"
              imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  attempt=1
                  until mariadb-dump --host=mariadb --user="${MARIADB_USER}" --password="${MARIADB_PASSWORD}" --single-transaction --quick --lock-tables=false "${MARIADB_DATABASE}" > /backup/database.sql; do
                    rm -f /backup/database.sql
                    if [ "$attempt" -ge 30 ]; then
                      exit 1
                    fi
                    attempt=$((attempt + 1))
                    sleep 5
                  done
              env:
                - name: HOME
                  value: /tmp
                - name: MARIADB_DATABASE
                  value: {{ .Values.mariadb.database | quote }}
                - name: MARIADB_USER
                  value: {{ .Values.mariadb.username | quote }}
                - name: MARIADB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.existingSecret }}
                      key: {{ .Values.secrets.wordpressDatabasePasswordKey }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsGroup: 999
                runAsNonRoot: true
                runAsUser: 999
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: database-tmp
                  mountPath: /tmp
          containers:
            - name: restic
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}@{{ .Values.backup.image.digest }}"
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  restic snapshots >/dev/null 2>&1 || restic init
                  restic backup --tag wordpress /backup/database.sql /uploads
                  restic forget --tag wordpress --keep-daily {{ .Values.backup.retention.daily }} --keep-weekly {{ .Values.backup.retention.weekly }} --keep-monthly {{ .Values.backup.retention.monthly }} --prune
              env:
                - name: HOME
                  value: /tmp
                - name: RESTIC_CACHE_DIR
                  value: /tmp/restic-cache
              envFrom:
                - secretRef:
                    name: {{ .Values.backup.secretName }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsGroup: 33
                runAsNonRoot: true
                runAsUser: 33
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: restic-tmp
                  mountPath: /tmp
                - name: uploads
                  mountPath: /uploads
                  readOnly: true
          volumes:
            - name: backup
              emptyDir: {}
            - name: database-tmp
              emptyDir: {}
            - name: restic-tmp
              emptyDir: {}
            - name: uploads
              persistentVolumeClaim:
                claimName: wordpress-uploads
{{- end }}