#==============================================================================
# WORDPRESS NGINX CONFIGURATION
#==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: wordpress-nginx
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: application
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      server_tokens off;
      root /var/www/html;
      index index.php;
      client_max_body_size 128m;

      gzip on;
      gzip_comp_level 5;
      gzip_min_length 1024;
      gzip_proxied any;
      gzip_vary on;
      gzip_types application/javascript application/json application/manifest+json application/xml font/ttf image/svg+xml text/css text/javascript text/plain text/xml;

      open_file_cache max=1000 inactive=60s;
      open_file_cache_valid 120s;
      open_file_cache_min_uses 2;
      open_file_cache_errors on;

      add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;

      location / {
        try_files $uri $uri/ /index.php?$args;
      }

      location ~* \.(?:avif|css|eot|gif|ico|jpe?g|js|mjs|png|svg|ttf|webp|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
      }

      location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_pass 127.0.0.1:9000;
      }

      location = /xmlrpc.php {
        deny all;
      }

      location ~* ^/(license\.txt|readme\.html|wp-config\.php)$ {
        deny all;
      }

      location ~ /\. {
        deny all;
      }
    }