#==============================================================================
# WORDPRESS EXTERNAL CRON
#==============================================================================

apiVersion: batch/v1
kind: CronJob
metadata:
  name: wordpress-cron
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: cron
spec:
  schedule: {{ .Values.cron.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: wordpress
            app.kubernetes.io/component: cron
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cron
              image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}@{{ .Values.wordpress.image.digest }}"
              imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
              args:
                - wget --quiet --output-document=/dev/null "http://wordpress:{{ .Values.wordpress.service.port }}/wp-cron.php?doing_wp_cron=$(date +%s)"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsGroup: 33
                runAsNonRoot: true
                runAsUser: 33
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: temporary
              emptyDir: {}