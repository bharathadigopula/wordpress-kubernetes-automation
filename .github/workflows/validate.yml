#==============================================================================
# WORDPRESS KUBERNETES VALIDATION
#==============================================================================

name: 01 - Validate WordPress Kubernetes Automation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-kubernetes-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 01 - Validate WordPress Kubernetes Automation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 01 - Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 02 - Validate Bash
        run: shellcheck --exclude=SC2016 scripts/*.sh

      - name: 03 - Validate Helm Automation
        run: bash scripts/validate.sh
